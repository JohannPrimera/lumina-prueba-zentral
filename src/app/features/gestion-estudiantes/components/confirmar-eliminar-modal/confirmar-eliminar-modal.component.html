@if (estudiante) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-lumina-tinta/50 px-4" (click)="!eliminando && cancelar.emit()">
    <div
      class="w-full max-w-sm rounded-2xl border-[3px] border-lumina-tinta bg-white p-6 text-center"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="titulo-eliminar"
      aria-describedby="detalle-eliminar"
      (click)="$event.stopPropagation()"
    >
      <span class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full border-[3px] border-lumina-tinta bg-red-50 font-display text-2xl text-red-600" aria-hidden="true">!</span>
      <h2 id="titulo-eliminar" class="mb-2 font-display text-xl uppercase text-lumina-tinta">¿Eliminar estudiante?</h2>
      <p id="detalle-eliminar" class="mb-6 text-sm text-lumina-texto">
        Se eliminará a <strong class="text-lumina-tinta">{{ estudiante.nombreCompleto }}</strong> ({{ estudiante.grado }} ·
        {{ estudiante.nivel }}) del listado. Esta acción no se puede deshacer.
      </p>
      <div class="flex justify-center gap-3">
        <button
          id="btn-cancelar-eliminar"
          type="button"
          (click)="cancelar.emit()"
          [disabled]="eliminando"
          class="rounded-full border-2 border-lumina-tinta px-4 py-2 text-xs font-bold uppercase text-lumina-tinta hover:bg-lumina-tinta/5 disabled:opacity-50"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="confirmar.emit()"
          [disabled]="eliminando"
          class="rounded-full border-2 border-red-700 bg-red-600 px-4 py-2 text-xs font-bold uppercase text-white hover:bg-red-700 disabled:opacity-60"
        >
          {{ eliminando ? 'Eliminando…' : 'Sí, eliminar' }}
        </button>
      </div>
    </div>
  </div>
}
