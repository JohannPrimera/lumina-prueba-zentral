<section id="comunidad" class="scroll-mt-4 bg-lumina-violeta px-5 py-20 sm:px-10 lg:py-28">
  <div class="mx-auto max-w-[1286px]">
    <h2 class="font-display text-[clamp(40px,5.2vw,68px)] uppercase leading-[1.02] text-white">
      Una comunidad <em class="font-serif normal-case italic text-lumina-lima">conectada</em>
    </h2>
    <p class="mt-5 max-w-lg text-lg font-medium leading-relaxed text-white/90">
      Cada rol entra con lo que le corresponde y ve el mismo dato, actualizado en el momento.
    </p>

    <!-- gap de 3px sobre fondo tinta = divisores que se reacomodan solos en cualquier breakpoint -->
    <ul
      class="mt-12 grid gap-[3px] overflow-hidden rounded-[22px] border-[3px] border-lumina-tinta bg-lumina-tinta sm:grid-cols-2 lg:grid-cols-4"
    >
      @for (rol of roles; track rol.titulo) {
        <li class="flex flex-col px-6 py-7" [ngClass]="claseTarjeta(rol.tono)">
          <h3 class="font-display text-xl uppercase">{{ rol.titulo }}</h3>
          <p class="mt-2 text-sm font-medium leading-relaxed opacity-85">{{ rol.descripcion }}</p>
          @if (rol.enlace) {
            <a
              [routerLink]="rol.enlace.ruta"
              class="mt-5 inline-flex w-fit items-center gap-2 rounded-full border-[2.5px] border-lumina-tinta bg-lumina-tinta px-4 py-2 text-[11px] font-bold uppercase tracking-[0.08em] text-lumina-lima transition hover:bg-lumina-violeta hover:text-white"
            >
              {{ rol.enlace.texto }} <span aria-hidden="true">→</span>
            </a>
          }
        </li>
      }
    </ul>
  </div>
</section>
