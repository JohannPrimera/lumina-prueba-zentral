<header class="relative z-30 mx-auto flex max-w-[1366px] items-center justify-between gap-4 px-5 py-6 sm:px-10">
  <a routerLink="/" fragment="inicio" aria-label="Lúmina, ir al inicio" (click)="cerrarMenu()">
    <app-lumina-logo />
  </a>

  <nav class="hidden items-center gap-6 lg:flex" aria-label="Principal">
    @for (enlace of enlaces; track enlace.fragmento) {
      <a
        routerLink="/"
        [fragment]="enlace.fragmento"
        class="text-xs font-bold uppercase tracking-[0.1em] text-lumina-tinta transition hover:text-lumina-violeta"
      >
        {{ enlace.etiqueta }}
      </a>
    }
    <a
      routerLink="/docente/estudiantes"
      class="rounded-full border-[2.5px] border-lumina-tinta px-5 py-2.5 text-xs font-bold uppercase tracking-[0.08em] text-lumina-tinta transition hover:bg-lumina-tinta hover:text-lumina-lima"
    >
      Panel docente
    </a>
    <a
      routerLink="/"
      fragment="inicio"
      class="rounded-full border-[2.5px] border-lumina-tinta bg-lumina-lima px-5 py-2.5 text-xs font-bold uppercase tracking-[0.08em] text-lumina-tinta transition hover:bg-lumina-lima-claro"
    >
      Solicitar demostración
    </a>
  </nav>

  <button
    type="button"
    class="flex items-center gap-2 rounded-full border-[2.5px] border-lumina-tinta bg-lumina-lima px-4 py-2 text-xs font-bold uppercase tracking-[0.1em] text-lumina-tinta lg:hidden"
    [attr.aria-expanded]="menuAbierto()"
    aria-controls="menu-movil"
    (click)="alternarMenu()"
  >
    <svg width="15" height="11" viewBox="0 0 16 12" aria-hidden="true">
      @if (menuAbierto()) {
        <path d="M3 1l10 10M13 1L3 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
      } @else {
        <path d="M1 1.5h14M1 6h14M1 10.5h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
      }
    </svg>
    Menú
  </button>

  @if (menuAbierto()) {
    <nav
      id="menu-movil"
      aria-label="Principal (móvil)"
      class="absolute inset-x-5 top-full flex flex-col gap-1 rounded-2xl border-[3px] border-lumina-tinta bg-white p-3 sm:inset-x-10 lg:hidden"
    >
      @for (enlace of enlaces; track enlace.fragmento) {
        <a
          routerLink="/"
          [fragment]="enlace.fragmento"
          (click)="cerrarMenu()"
          class="rounded-xl px-4 py-3 text-sm font-bold uppercase tracking-[0.08em] text-lumina-tinta hover:bg-lumina-fondo"
        >
          {{ enlace.etiqueta }}
        </a>
      }
      <a
        routerLink="/docente/estudiantes"
        (click)="cerrarMenu()"
        class="mt-1 rounded-full border-[2.5px] border-lumina-tinta px-4 py-3 text-center text-xs font-bold uppercase tracking-[0.08em] text-lumina-tinta"
      >
        Panel docente
      </a>
      <a
        routerLink="/"
        fragment="inicio"
        (click)="cerrarMenu()"
        class="rounded-full border-[2.5px] border-lumina-tinta bg-lumina-lima px-4 py-3 text-center text-xs font-bold uppercase tracking-[0.08em] text-lumina-tinta"
      >
        Solicitar demostración
      </a>
    </nav>
  }
</header>
