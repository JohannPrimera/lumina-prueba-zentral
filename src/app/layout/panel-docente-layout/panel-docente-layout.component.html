<div class="min-h-screen bg-lumina-fondo text-lumina-tinta lg:flex">
  <aside
    class="bg-lumina-noche text-white lg:sticky lg:top-0 lg:flex lg:h-screen lg:w-72 lg:shrink-0 lg:flex-col lg:border-r-[3px] lg:border-lumina-tinta"
  >
    <div class="flex items-center justify-between gap-4 px-5 py-5 lg:px-7 lg:py-8">
      <a routerLink="/" aria-label="Volver a la landing de Lúmina">
        <app-lumina-logo subtitulo="Panel del docente" [invertido]="true" />
      </a>
      <a
        routerLink="/"
        class="rounded-full border-2 border-white/40 px-3 py-1.5 text-[11px] font-bold uppercase tracking-[0.08em] text-white hover:border-lumina-lima hover:text-lumina-lima lg:hidden"
      >
        ← Sitio
      </a>
    </div>

    <div class="mx-7 mb-6 hidden items-center gap-3 rounded-2xl border-2 border-white/15 p-3 lg:flex">
      <span
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border-[2.5px] border-lumina-tinta bg-lumina-lima font-display text-lg text-lumina-tinta"
        aria-hidden="true"
      >
        {{ docente.iniciales }}
      </span>
      <div class="min-w-0">
        <p class="truncate text-sm font-bold">{{ docente.nombre }}</p>
        <p class="truncate text-xs text-white/60">{{ docente.rol }}</p>
      </div>
    </div>

    <nav aria-label="Módulos del panel" class="overflow-x-auto px-5 pb-4 lg:flex-1 lg:px-4 lg:pb-0">
      <ul class="flex gap-2 lg:flex-col">
        @for (item of menu; track item.etiqueta) {
          <li class="shrink-0">
            @if (item.ruta) {
              <a
                [routerLink]="item.ruta"
                routerLinkActive="!bg-lumina-lima !text-lumina-tinta border-lumina-tinta"
                #activo="routerLinkActive"
                [attr.aria-current]="activo.isActive ? 'page' : null"
                class="flex items-center justify-between rounded-full border-2 border-transparent px-4 py-2.5 text-sm font-bold text-white transition hover:bg-white/10 lg:rounded-xl"
              >
                {{ item.etiqueta }}
              </a>
            } @else {
              <span
                class="flex cursor-not-allowed items-center gap-3 rounded-full px-4 py-2.5 text-sm font-semibold text-white/45 lg:justify-between lg:rounded-xl"
                aria-disabled="true"
                title="Disponible próximamente"
              >
                {{ item.etiqueta }}
                <span class="rounded-full border border-white/25 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide">Pronto</span>
              </span>
            }
          </li>
        }
      </ul>
    </nav>

    <div class="hidden border-t-2 border-white/10 p-4 lg:block">
      <a
        routerLink="/"
        class="flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-bold text-white/80 transition hover:bg-white/10 hover:text-lumina-lima"
      >
        <span aria-hidden="true">←</span> Volver al sitio
      </a>
    </div>
  </aside>

  <main class="min-w-0 flex-1">
    <router-outlet />
  </main>
</div>

<app-notificaciones />
